name: Compile Typst Document
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Compile
        run: typst compile donor-doc.typ

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: donor-doc
          path: donor-doc.pdf
