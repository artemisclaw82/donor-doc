name: Compile Donor PDF
on: [push]

# This is required to allow the action to push changes back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history so git push works correctly
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Commit and Push PDF
        run: |
          # Configure git with a dummy user
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the PDF
          git add -f donor_doc.pdf

          # Only commit and push if the PDF actually changed
          if git diff --staged --quiet; then
            echo "No changes to the PDF. Skipping push."
          else
            git commit -m "chore: update compiled donor_doc.pdf"
            git push
          fi
